[package]
name = "HaloClock"
version = "1.42.0"
edition = "2021"


[dependencies]
chrono = "0.4.43"
eframe = "0.28"
egui = "0.28"
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rodio = "0.17"
hound = "3.5"
futures = "0.3"

[profile.release]
opt-level = 3

[package.metadata.winres]
OriginalFilename = "clock_face.exe"

[build-dependencies]
winres = "0.1"

[package.metadata]
# Prevent console window
windows_subsystem = "windows"

[[bin]]
name = "HaloClock"
path = "src/main.rs"
