name: HaloClock CI (Quality & Info)

run-name: ${{ github.actor }} is verifying HaloClock 🚀

on: [push]

jobs:
  Verify-And-Report:
    # We use Windows-latest because HaloClock is a Windows app!
    runs-on: windows-latest 
    
    steps:
      # --- INFO STEPS (From the Demo) ---
      - run: echo "🚀 Triggered by ${{ github.event_name }} from ${{ github.actor }}"
      - run: echo "💻 Running on a ${{ runner.os }} server!"

      # --- THE REAL WORK (The Rust Way) ---
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust & Clippy
        run: |
          rustup update stable
          rustup component add clippy

      - name: Build Check
        run: cargo check --release

      - name: Run Clippy (The Paperclip)
        run: cargo clippy -- -D warnings

      - run: echo "🍏 Build and Quality Check Complete for ${{ github.repository }}!"