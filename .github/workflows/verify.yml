name: HaloClock Sanity Check

run-name: ${{ github.actor }} is checking the pipes 🛠️

on: [push]

jobs:
  Windows-Environment-Check:
    runs-on: windows-latest
    
    steps:
      - name: 1. Greeting
        run: echo "Hello from the GitHub Windows Runner! Everything is connected."

      - name: 2. Checkout Code
        uses: actions/checkout@v4

      - name: 3. Verify Files (The Debugger)
        # This will show us if clock.rs or Clock.rs exists!
        run: Get-ChildItem -Recurse
        shell: pwsh

      - name: 4. Final Status
        run: echo "The workspace is ready for Rust whenever you are, ${{ github.actor }}."